<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>STREAM SCHEDULE</title>

<style>
:root {
  --bg: #090909;
  --panel: #151515;
  --line: #353535;
  --silver: #c9c9c9;
  --text: #f4f4f4;
  --muted: #999;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background:
    radial-gradient(ellipse at top, #292929 0%, #111 38%, #080808 80%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
    "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  min-height: 100vh;
}

header {
  padding: 42px 20px 30px;
  text-align: center;
  border-bottom: 1px solid #303030;
  background: linear-gradient(180deg, #202020, #111);
}

.eyebrow {
  color: #aaa;
  letter-spacing: 5px;
  font-size: 10px;
  margin-bottom: 13px;
}

h1 {
  margin: 0;
  font-size: clamp(25px, 7vw, 38px);
  font-weight: 500;
  letter-spacing: 4px;
}

.header-line {
  width: 52px;
  height: 1px;
  background: #aaa;
  margin: 20px auto 0;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 28px 16px 55px;
}

section { margin-bottom: 42px; }

.section-heading {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.section-heading h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 2px;
}

.section-heading span {
  color: #999;
  font-size: 10px;
  letter-spacing: 2px;
}

.section-heading::after {
  content: "";
  height: 1px;
  background: #383838;
  flex: 1;
}

.card {
  background: linear-gradient(135deg, #1b1b1b, #101010);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}

.stream-card {
  display: grid;
  grid-template-columns: minmax(110px, 38%) 1fr;
  gap: 15px;
  padding: 13px;
  margin-bottom: 12px;
}

.thumb {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: #292929;
  border-radius: 4px;
}

.stream-info {
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 9px;
}

.stream-title {
  color: #f5f5f5;
  font-size: 14px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.stream-date {
  color: #bbb;
  font-size: 12px;
  line-height: 1.5;
}

.stream-link {
  display: inline-block;
  width: fit-content;
  padding: 7px 12px;
  border: 1px solid #666;
  border-radius: 3px;
  color: #eee;
  text-decoration: none;
  font-size: 11px;
  letter-spacing: 1px;
}

.stream-link:hover {
  background: #eee;
  color: #111;
}

.empty {
  padding: 28px 12px;
  text-align: center;
  color: #999;
  font-size: 13px;
  border: 1px dashed #393939;
  border-radius: 6px;
  line-height: 1.8;
}

.month-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 1px 12px;
  margin-bottom: 14px;
  scrollbar-width: thin;
}

.month-tab {
  flex: 0 0 auto;
  border: 1px solid #454545;
  border-radius: 4px;
  background: #151515;
  color: #aaa;
  padding: 10px 16px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}

.month-tab.active {
  color: #111;
  background: linear-gradient(135deg, #eee, #aaa);
  border-color: #ddd;
  font-weight: 600;
}

.archive-count {
  color: #999;
  font-size: 11px;
  margin: 0 0 13px;
}

.week-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.week-day {
  border: 1px solid #333;
  background: #151515;
  border-radius: 5px;
  padding: 15px 10px;
  text-align: center;
}

.week-en {
  display: block;
  color: #999;
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.week-ja {
  font-size: 13px;
}

footer {
  text-align: center;
  color: #777;
  border-top: 1px solid #292929;
  padding: 22px 12px;
  font-size: 10px;
  letter-spacing: 1px;
}

@media (min-width: 600px) {
  .week-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  main { padding-top: 38px; }
}

@media (max-width: 380px) {
  .stream-card { grid-template-columns: 1fr; }
  .thumb { max-height: 200px; }
}
</style>
</head>

<body>
<header>
  <div class="eyebrow">OFFICIAL STREAM INFORMATION</div>
  <h1>STREAM SCHEDULE</h1>
  <div class="header-line"></div>
</header>

<main>
  <section>
    <div class="section-heading">
      <h2>UPCOMING STREAMS</h2>
      <span>配信予定</span>
    </div>
    <div id="upcoming-list">
      <div class="empty">配信予定を読み込み中...</div>
    </div>
  </section>

  <section>
    <div class="section-heading">
      <h2>PAST STREAMS</h2>
      <span>過去の配信</span>
    </div>
    <div id="month-tabs" class="month-tabs"></div>
    <div id="archive-list">
      <div class="empty">過去の配信を読み込み中...</div>
    </div>
  </section>

  <section>
    <div class="section-heading">
      <h2>WEEKLY SCHEDULE</h2>
      <span>週間スケジュール</span>
    </div>
    <div id="week-grid" class="week-grid"></div>
  </section>
</main>

<footer>
  <div id="updated">SCHEDULE DATA</div>
  <div style="margin-top:8px;">STREAM SCHEDULE</div>
</footer>

<script>
const DATA_URL =
  "https://raw.githubusercontent.com/nhkk6zprtg-gif/oshi-schedule/main/schedule.json";

const $ = (id) => document.getElementById(id);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function formatDate(value) {
  if (!value) return "日時未定";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "日時未定";

  return new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    weekday: "short",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).format(date).replace(/\//g, ".");
}

function monthKey(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit"
  }).formatToParts(date);
  const year = parts.find(p => p.type === "year").value;
  const month = parts.find(p => p.type === "month").value;
  return `${year}-${month}`;
}

function monthLabel(key) {
  const [year, month] = key.split("-");
  return `${year}年${Number(month)}月`;
}

function streamCard(stream) {
  const title = escapeHTML(stream.title || "配信");
  const date = escapeHTML(formatDate(stream.scheduledAt));
  const url = /^https:\/\/www\.youtube\.com\/watch\?v=[\w-]+$/.test(stream.url || "")
    ? stream.url
    : (stream.videoId
        ? `https://www.youtube.com/watch?v=${encodeURIComponent(stream.videoId)}`
        : "https://www.youtube.com/@kanae");

  const thumbnail = /^https?:\/\//i.test(stream.thumbnail || "")
    ? stream.thumbnail
    : "";

  return `
    <article class="card stream-card">
      <img class="thumb" src="${escapeHTML(thumbnail)}"
        alt="" loading="lazy"
        onerror="this.style.visibility='hidden'">
      <div class="stream-info">
        <div class="stream-title">${title}</div>
        <div class="stream-date">${date}</div>
        <a class="stream-link" href="${escapeHTML(url)}"
          target="_blank" rel="noopener noreferrer">WATCH ON YOUTUBE ↗</a>
      </div>
    </article>`;
}

function renderUpcoming(streams) {
  const list = $("upcoming-list");
  if (!streams.length) {
    list.innerHTML = '<div class="empty">現在、公開されている配信予定はありません。</div>';
    return;
  }
  list.innerHTML = streams.map(streamCard).join("");
}

function renderArchives(streams) {
  const tabs = $("month-tabs");
  const list = $("archive-list");

  const validStreams = streams.filter(stream => monthKey(stream.scheduledAt));
  const groups = {};

  validStreams.forEach(stream => {
    const key = monthKey(stream.scheduledAt);
    if (!groups[key]) groups[key] = [];
    groups[key].push(stream);
  });

  const months = Object.keys(groups).sort((a, b) => b.localeCompare(a));

  if (!months.length) {
    tabs.innerHTML = "";
    list.innerHTML = '<div class="empty">過去の配信データはまだありません。</div>';
    return;
  }

  tabs.innerHTML = months.map((month, index) => `
    <button class="month-tab ${index === 0 ? "active" : ""}"
      type="button" data-month="${month}">
      ${monthLabel(month)}
    </button>
  `).join("");

  function showMonth(month) {
    tabs.querySelectorAll(".month-tab").forEach(tab => {
      tab.classList.toggle("active", tab.dataset.month === month);
    });

    const items = groups[month].slice().sort((a, b) =>
      (b.scheduledAt || "").localeCompare(a.scheduledAt || "")
    );

    list.innerHTML = `
      <div class="archive-count">${monthLabel(month)} ・ ${items.length}件</div>
      ${items.map(streamCard).join("")}`;
  }

  tabs.querySelectorAll(".month-tab").forEach(tab => {
    tab.addEventListener("click", () => showMonth(tab.dataset.month));
  });

  showMonth(months[0]);
}

function renderWeek(days) {
  const grid = $("week-grid");
  const fallback = [
    ["月曜日", "MON"], ["火曜日", "TUE"], ["水曜日", "WED"],
    ["木曜日", "THU"], ["金曜日", "FRI"], ["土曜日", "SAT"],
    ["日曜日", "SUN"]
  ];

  const items = Array.isArray(days) && days.length
    ? days.map(day => [day.day || "", day.dayEn || ""])
    : fallback;

  grid.innerHTML = items.map(day => `
    <div class="week-day">
      <span class="week-en">${escapeHTML(day[1])}</span>
      <span class="week-ja">${escapeHTML(day[0])}</span>
    </div>
  `).join("");
}

async function loadSchedule() {
  try {
    const response = await fetch(DATA_URL + "?t=" + Date.now());
    if (!response.ok) throw new Error("データ取得に失敗しました");

    const data = await response.json();

    renderUpcoming(Array.isArray(data.streams) ? data.streams : []);
    renderArchives(Array.isArray(data.pastStreams) ? data.pastStreams : []);
    renderWeek(data.weeklySchedule);

    $("updated").textContent = data.updatedAt
      ? "最終更新：" + formatDate(data.updatedAt)
      : "SCHEDULE DATA";
  } catch (error) {
    $("upcoming-list").innerHTML =
      '<div class="empty">配信データを読み込めませんでした。時間をおいて再度お試しください。</div>';
    $("archive-list").innerHTML =
      '<div class="empty">過去の配信データを読み込めませんでした。</div>';
    renderWeek([]);
  }
}

loadSchedule();
</script>
</body>
</html>
