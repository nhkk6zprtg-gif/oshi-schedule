<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>KANAE | STREAM SCHEDULE</title>
<style>
:root {
  color-scheme: dark;
  --bg: #080808;
  --panel: #111;
  --silver: #c9c9c9;
  --muted: #858585;
  --line: #343434;
  --white: #f5f5f5;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse at 50% 0%, #363636 0%, #171717 22%, transparent 56%),
    #080808;
  color: var(--white);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
    "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  letter-spacing: .06em;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
.container { width: min(100% - 34px, 880px); margin: auto; }
header {
  padding: 48px 0 38px;
  text-align: center;
  border-bottom: 1px solid #444;
  position: relative;
}
header::after {
  content: "";
  display: block;
  width: 70px;
  height: 2px;
  margin: 28px auto 0;
  background: linear-gradient(90deg, transparent, #eee, transparent);
}
.eyebrow {
  color: #aaa;
  font-size: 9px;
  letter-spacing: .48em;
}
h1 {
  margin: 20px 0 8px;
  font-size: clamp(34px, 9vw, 56px);
  font-weight: 300;
  letter-spacing: .22em;
  text-indent: .22em;
  text-shadow: 0 0 28px #ffffff20;
}
.subtitle {
  color: #ccc;
  font-size: 11px;
  letter-spacing: .42em;
}
.header-caption {
  margin-top: 16px;
  color: #777;
  font-size: 9px;
  letter-spacing: .2em;
}
.channel-link {
  display: inline-block;
  margin-top: 25px;
  padding: 13px 27px;
  border: 1px solid #777;
  background: linear-gradient(135deg, #ffffff0b, #ffffff01);
  font-size: 10px;
  letter-spacing: .16em;
  transition: .25s;
}
.channel-link:hover {
  background: #ddd;
  color: #090909;
}
main { padding: 40px 0 56px; }
.section { margin-bottom: 48px; }
.section-heading {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-bottom: 21px;
}
.number {
  color: #999;
  font-size: 11px;
  letter-spacing: .18em;
}
h2 {
  margin: 0;
  font-size: 15px;
  font-weight: 400;
  letter-spacing: .17em;
}
.section-heading::after {
  content: "";
  height: 1px;
  flex: 1;
  background: linear-gradient(90deg, #666, #292929);
}
.section-caption {
  color: #777;
  font-size: 9px;
  letter-spacing: .16em;
  margin: -11px 0 18px;
}
.status {
  padding: 28px 16px;
  border: 1px solid var(--line);
  background: #101010;
  color: #aaa;
  text-align: center;
  font-size: 12px;
  line-height: 1.9;
}
.stream-card {
  position: relative;
  display: grid;
  grid-template-columns: 44% 1fr;
  gap: 22px;
  padding: 14px;
  margin-bottom: 16px;
  border: 1px solid #3a3a3a;
  background: linear-gradient(125deg, #1c1c1c, #101010 55%, #0b0b0b);
  box-shadow: 0 12px 30px #00000050;
  transition: border-color .2s, transform .2s;
}
.stream-card:hover {
  border-color: #888;
  transform: translateY(-2px);
}
.thumbnail-link { display: block; align-self: center; }
.thumbnail {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: #222;
  filter: saturate(.8);
}
.stream-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  padding: 5px 4px;
}
.live-label {
  display: flex;
  align-items: center;
  gap: 9px;
  color: #c9c9c9;
  font-size: 9px;
  letter-spacing: .2em;
  margin-bottom: 13px;
}
.live-label::before {
  content: "";
  width: 16px;
  height: 1px;
  background: #ccc;
}
.stream-title {
  font-size: 15px;
  line-height: 1.8;
  overflow-wrap: anywhere;
  margin-bottom: 13px;
}
.date-label {
  color: #777;
  font-size: 9px;
  letter-spacing: .15em;
  margin-bottom: 5px;
}
.stream-date {
  color: #e1e1e1;
  font-size: 12px;
  line-height: 1.9;
}
.watch-link {
  display: inline-block;
  align-self: flex-start;
  margin-top: 17px;
  padding: 0 0 5px;
  border-bottom: 1px solid #888;
  color: #eee;
  font-size: 9px;
  letter-spacing: .13em;
}
.watch-link::after { content: "  ↗"; }
.week-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border-top: 1px solid #414141;
  border-left: 1px solid #414141;
}
.week-day {
  min-width: 0;
  padding: 20px 1px 18px;
  text-align: center;
  border-right: 1px solid #414141;
  border-bottom: 1px solid #414141;
  background: linear-gradient(145deg, #191919, #0d0d0d);
}
.week-day .en {
  display: block;
  color: #888;
  font-size: 9px;
  letter-spacing: .08em;
}
.week-day .ja {
  display: block;
  margin-top: 10px;
  color: #ddd;
  font-size: 10px;
  letter-spacing: 0;
  white-space: nowrap;
}
.week-day.today {
  background: linear-gradient(145deg, #454545, #202020);
  box-shadow: inset 0 2px #eee;
}
.week-day.today .en { color: #eee; }
.week-day.today .ja { color: #fff; }
.note {
  color: #777;
  font-size: 10px;
  line-height: 1.9;
  margin-top: 14px;
}
#updated {
  text-align: center;
  overflow-wrap: anywhere;
  padding: 15px 0;
  border-top: 1px solid #292929;
  font-size: 9px;
  letter-spacing: .13em;
}
footer {
  padding: 27px 16px 34px;
  border-top: 1px solid #333;
  color: #777;
  font-size: 9px;
  text-align: center;
  letter-spacing: .2em;
}
.footer-mark {
  display: block;
  margin-bottom: 12px;
  color: #aaa;
  font-size: 14px;
  letter-spacing: .4em;
}
@media (max-width: 480px) {
  .container { width: calc(100% - 28px); }
  header { padding: 38px 0 27px; }
  header::after { margin-top: 23px; }
  h1 { font-size: clamp(30px, 9vw, 43px); }
  main { padding-top: 30px; }
  .section { margin-bottom: 39px; }
  .section-heading { gap: 10px; }
  h2 { font-size: 13px; letter-spacing: .12em; }
  .stream-card {
    grid-template-columns: 1fr;
    gap: 13px;
    padding: 11px;
  }
  .thumbnail { aspect-ratio: 16 / 9; }
  .stream-info { padding: 5px 4px 7px; }
  .stream-title { font-size: 14px; }
  .week-day { padding: 16px 0; }
  .week-day .en { font-size: 8px; }
  .week-day .ja { font-size: 9px; }
}
</style>
</head>
<body>
<header>
  <div class="container">
    <div class="eyebrow">OFFICIAL STREAM INFORMATION</div>
    <h1 id="channel-name">KANAE</h1>
    <div class="subtitle">STREAM SCHEDULE</div>
    <div class="header-caption">配信スケジュール</div>
    <a class="channel-link" href="https://youtube.com/@kanae"
       target="_blank" rel="noopener">YOUTUBE CHANNEL ↗</a>
  </div>
</header>

<main class="container">
  <section class="section">
    <div class="section-heading">
      <span class="number">01</span>
      <h2>UPCOMING STREAMS</h2>
    </div>
    <p class="section-caption">NEXT STREAM · 配信予定</p>
    <div id="streams" aria-live="polite">
      <div class="status">配信予定を読み込んでいます…</div>
    </div>
  </section>

  <section class="section">
    <div class="section-heading">
      <span class="number">02</span>
      <h2>WEEKLY SCHEDULE</h2>
    </div>
    <p class="section-caption">WEEK AT A GLANCE · 曜日一覧</p>
    <div class="week-grid" id="week-grid"></div>
    <p class="note">
      ※ 曜日の一覧です。曜日ごとの配信時間は、情報が登録されている場合のみ表示できます。
    </p>
  </section>

  <div class="note" id="updated"></div>
</main>

<footer>
  <span class="footer-mark">K</span>
  STREAM SCHEDULE · DARK SILVER EDITION
</footer>

<script>
const DATA_URL =
  "https://raw.githubusercontent.com/nhkk6zprtg-gif/oshi-schedule/main/schedule.json";

const streamsEl = document.getElementById("streams");
const updatedEl = document.getElementById("updated");
const weekGrid = document.getElementById("week-grid");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function formatDate(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "日時未定";

  return new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    weekday: "short",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).format(date);
}

function renderStreams(streams) {
  const now = Date.now();
  const upcoming = (streams || [])
    .filter(stream => {
      const date = new Date(stream.scheduledAt).getTime();
      return Number.isFinite(date) && date > now;
    })
    .sort((a, b) =>
      new Date(a.scheduledAt) - new Date(b.scheduledAt)
    );

  if (!upcoming.length) {
    streamsEl.innerHTML =
      '<div class="status">現在、確認できる配信予定はありません。</div>';
    return;
  }

  streamsEl.innerHTML = upcoming.map(stream => {
    const thumbnail = stream.thumbnail
      ? `<img class="thumbnail"
          src="${escapeHTML(stream.thumbnail)}"
          alt="" loading="lazy">`
      : '<div class="thumbnail"></div>';

    return `
      <article class="stream-card">
        <a class="thumbnail-link"
           href="${escapeHTML(stream.url)}"
           target="_blank" rel="noopener">
          ${thumbnail}
        </a>
        <div class="stream-info">
          <div class="live-label">SCHEDULED STREAM</div>
          <div class="stream-title">${escapeHTML(stream.title)}</div>
          <div class="date-label">STREAM DATE / 配信日時</div>
          <div class="stream-date">
            ${escapeHTML(formatDate(stream.scheduledAt))}
            <br>JST / 日本時間
          </div>
          <a class="watch-link"
             href="${escapeHTML(stream.url)}"
             target="_blank" rel="noopener">WATCH ON YOUTUBE</a>
        </div>
      </article>`;
  }).join("");
}

function renderWeek(days) {
  const today = new Date().getDay();
  const todayIndex = (today + 6) % 7;

  weekGrid.innerHTML = (days || []).map((day, index) => `
    <div class="week-day ${index === todayIndex ? "today" : ""}">
      <span class="en">${escapeHTML(day.dayEn)}</span>
      <span class="ja">${escapeHTML(day.day)}</span>
    </div>
  `).join("");
}

async function loadSchedule() {
  try {
    const response = await fetch(
      DATA_URL + "?t=" + Date.now(),
      { cache: "no-store" }
    );
    if (!response.ok) throw new Error("配信データを読み込めませんでした");

    const data = await response.json();

    if (data.channel && data.channel.title) {
      document.getElementById("channel-name").textContent =
        data.channel.title;
    }

    renderStreams(data.streams);
    renderWeek(data.weeklySchedule);

    if (data.updatedAt) {
      updatedEl.textContent =
        "DATA UPDATED · " + formatDate(data.updatedAt);
    }
  } catch (error) {
    streamsEl.innerHTML =
      '<div class="status">配信情報を読み込めませんでした。時間をおいて再度ご確認ください。</div>';
    console.error(error);
  }
}

loadSchedule();
</script>
</body>
</html>
