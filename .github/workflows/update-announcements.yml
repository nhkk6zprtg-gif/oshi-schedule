
name: Update Kanae Announcements

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-announcements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: pip install beautifulsoup4

      - name: Fetch official store and product images
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from urllib.parse import urljoin, urlparse
          from bs4 import BeautifulSoup

          JST = timezone(timedelta(hours=9))
          source = "https://shop.nijisanji.jp/1019"

          def get_html(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read().decode("utf-8", "replace")

          def get_image(url):
              try:
                  soup = BeautifulSoup(get_html(url), "html.parser")

                  for key, value in [
                      ("property", "og:image"),
                      ("name", "twitter:image"),
                  ]:
                      tag = soup.find("meta", attrs={key: value})
                      if tag and tag.get("content"):
                          image_url = urljoin(url, tag["content"].strip())
                          if urlparse(image_url).scheme in ("http", "https"):
                              return image_url

                  for tag in soup.find_all("script", type="application/ld+json"):
                      try:
                          data = json.loads(tag.string or tag.get_text())
                      except Exception:
                          continue

                      items = data if isinstance(data, list) else [data]
                      for item in items:
                          if not isinstance(item, dict):
                              continue
                          img = item.get("image")
                          if isinstance(img, str):
                              return urljoin(url, img)
                          if isinstance(img, list) and img:
                              if isinstance(img[0], str):
                                  return urljoin(url, img[0])
                          if isinstance(img, dict) and img.get("url"):
                              return urljoin(url, img["url"])
              except Exception as e:
                  print("Image lookup skipped:", url, str(e))

              return ""

          html = get_html(source)
          soup = BeautifulSoup(html, "html.parser")
          found = {}

          for a in soup.find_all("a", href=True):
              title = " ".join(a.get_text(" ", strip=True).split())
              if len(title) < 4:
                  continue

              context = a
              is_new = False

              for _ in range(4):
                  if context is None:
                      break
                  if re.search(r"\bNEW\b", context.get_text(" ", strip=True), re.I):
                      is_new = True
                      break
                  context = context.parent

              if not is_new:
                  continue

              url = urljoin(source, a["href"])
              parsed = urlparse(url)

              if parsed.netloc != "shop.nijisanji.jp":
                  continue
              if parsed.path.rstrip("/") == "/1019":
                  continue
              if "searchAjax" in url or "login" in url.lower():
                  continue

              title = re.sub(r"^\s*NEW\s*", "", title, flags=re.I).strip()
              if len(title) < 3:
                  continue

              image_url = get_image(url)

              found[url] = {
                  "type": "公式ストア新着",
                  "title": title,
                  "date": "確認日：" + datetime.now(JST).strftime("%Y-%m-%d"),
                  "salesPeriod": "",
                  "url": url,
                  "imageUrl": image_url
              }

          if not found:
              raise SystemExit(
                  "新着商品を抽出できませんでした。"
                  "既存の告知データは変更しません。"
              )

          try:
              with open("announcements.json", encoding="utf-8") as f:
                  data = json.load(f)
          except (OSError, json.JSONDecodeError):
              data = {"updatedAt": "", "announcements": []}

          existing = data.get("announcements", [])
          if not isinstance(existing, list):
              existing = []

          merged = {}
          for item in existing:
              if isinstance(item, dict) and item.get("url"):
                  merged[item["url"]] = item

          for url, item in found.items():
              old = merged.get(url, {})
              merged[url] = {**old, **item}
              if not item["imageUrl"] and old.get("imageUrl"):
                  merged[url]["imageUrl"] = old["imageUrl"]

          data["updatedAt"] = datetime.now(JST).isoformat(timespec="seconds")
          data["announcements"] = list(merged.values())[:50]

          with open("announcements.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("新着候補:", len(found), "件")
          print("画像URL取得:", sum(bool(x["imageUrl"]) for x in found.values()), "件")
          print("告知データ:", len(data["announcements"]), "件")
          PY

      - name: Commit announcements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add announcements.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Kanae announcements with images"
            git push
          else
            echo "告知データに変更はありません"
          fi
