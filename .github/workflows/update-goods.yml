
name: Update Goods

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-goods
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official store goods
        run: python update_goods.py

      - name: Commit updated announcements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add announcements.json announcements_kuzuha.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update goods announcements"
            git push
          fi
